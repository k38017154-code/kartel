<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>2D Стрелялка</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    canvas {
      border: 2px solid #444;
      background: #222;
    }
    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div id="score">Очки: 0</div>
  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    // Игровые переменные
    let score = 0;
    let bullets = [];
    let targets = [];
    let mouseX = canvas.width / 2;
    let mouseY = canvas.height / 2;
    let isShooting = false;

    // Игрок (фиксирован в центре)
    const player = { x: canvas.width / 2, y: canvas.height / 2 };

    // Обработка мыши
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouseX = e.clientX - rect.left;
      mouseY = e.clientY - rect.top;
    });

    canvas.addEventListener('mousedown', () => isShooting = true);
    canvas.addEventListener('mouseup', () => isShooting = false);
    canvas.addEventListener('mouseleave', () => isShooting = false);

    // Класс пули
    class Bullet {
      constructor(x, y, angle) {
        this.x = x;
        this.y = y;
        this.speed = 8;
        this.angle = angle;
        this.radius = 3;
      }

      update() {
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffcc00';
        ctx.fill();
      }

      isOffScreen() {
        return (
          this.x < 0 || this.x > canvas.width ||
          this.y < 0 || this.y > canvas.height
        );
      }
    }

    // Класс мишени
    class Target {
      constructor() {
        this.radius = 20;
        this.reset();
        this.speedX = (Math.random() - 0.5) * 2; // медленное движение
        this.speedY = (Math.random() - 0.5) * 2;
      }

      reset() {
        // Появляется за пределами экрана
        const side = Math.floor(Math.random() * 4);
        switch (side) {
          case 0: this.x = Math.random() * canvas.width; this.y = -this.radius; break; // сверху
          case 1: this.x = canvas.width + this.radius; this.y = Math.random() * canvas.height; break; // справа
          case 2: this.x = Math.random() * canvas.width; this.y = canvas.height + this.radius; break; // снизу
          case 3: this.x = -this.radius; this.y = Math.random() * canvas.height; break; // слева
        }
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        // Если вышла за экран — пересоздать
        if (this.x < -50 || this.x > canvas.width + 50 ||
            this.y < -50 || this.y > canvas.height + 50) {
          this.reset();
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ff4444';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      isHit(bullet) {
        const dx = this.x - bullet.x;
        const dy = this.y - bullet.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        return distance < this.radius + bullet.radius;
      }
    }

    // Создание мишеней
    for (let i = 0; i < 8; i++) {
      targets.push(new Target());
    }

    // Основной игровой цикл
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Стрельба (автоматическая при зажатии)
      if (isShooting) {
        const angle = Math.atan2(mouseY - player.y, mouseX - player.x);
        bullets.push(new Bullet(player.x, player.y, angle));
      }

      // Обновление и отрисовка пуль
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].update();
        bullets[i].draw();

        if (bullets[i].isOffScreen()) {
          bullets.splice(i, 1);
        }
      }

      // Обновление и отрисовка мишеней
      for (let i = targets.length - 1; i >= 0; i--) {
        targets[i].update();
        targets[i].draw();

        // Проверка попаданий
        for (let j = bullets.length - 1; j >= 0; j--) {
          if (targets[i].isHit(bullets[j])) {
            // Попадание!
            score += 10;
            scoreEl.textContent = `Очки: ${score}`;
            bullets.splice(j, 1);
            targets[i].reset(); // Переместить мишень
            break;
          }
        }
      }

      // Рисуем прицел (крестик)
      ctx.strokeStyle = '#00ff00';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(mouseX - 10, mouseY);
      ctx.lineTo(mouseX + 10, mouseY);
      ctx.moveTo(mouseX, mouseY - 10);
      ctx.lineTo(mouseX, mouseY + 10);
      ctx.stroke();

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html><!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Стрелялка: Люди vs Люди</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    canvas {
      border: 2px solid #444;
      background: #222;
    }
    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 20px;
    }
    #health {
      position: absolute;
      top: 10px;
      right: 10px;
      color: #ff5555;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div id="score">Очки: 0</div>
  <div id="health">Здоровье: 100</div>
  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const healthEl = document.getElementById('health');

    // Игровые переменные
    let score = 0;
    let health = 100;
    let bullets = [];
    let enemies = [];
    let mouseX = canvas.width / 2;
    let mouseY = canvas.height / 2;
    let isShooting = false;

    // Игрок (в центре)
    const player = { x: canvas.width / 2, y: canvas.height / 2 };

    // Обработка мыши
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouseX = e.clientX - rect.left;
      mouseY = e.clientY - rect.top;
    });

    canvas.addEventListener('mousedown', () => isShooting = true);
    canvas.addEventListener('mouseup', () => isShooting = false);
    canvas.addEventListener('mouseleave', () => isShooting = false);

    // Класс пули
    class Bullet {
      constructor(x, y, angle) {
        this.x = x;
        this.y = y;
        this.speed = 10;
        this.angle = angle;
        this.radius = 2;
      }

      update() {
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffff00';
        ctx.fill();
      }

      isOffScreen() {
        return (
          this.x < 0 || this.x > canvas.width ||
          this.y < 0 || this.y > canvas.height
        );
      }
    }

    // Класс врага (человек)
    class Enemy {
      constructor() {
        this.radius = 12;
        this.reset();
        this.speed = 0.8 + Math.random() * 0.7; // разная скорость
        this.color = '#ff6b6b';
      }

      reset() {
        // Появляется за пределами экрана
        const side = Math.floor(Math.random() * 4);
        switch (side) {
          case 0: this.x = Math.random() * canvas.width; this.y = -this.radius; break; // сверху
          case 1: this.x = canvas.width + this.radius; this.y = Math.random() * canvas.height; break; // справа
          case 2: this.x = Math.random() * canvas.width; this.y = canvas.height + this.radius; break; // снизу
          case 3: this.x = -this.radius; this.y = Math.random() * canvas.height; break; // слева
        }
        // Направление к игроку
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        this.dirX = dx / dist;
        this.dirY = dy / dist;
      }

      update() {
        this.x += this.dirX * this.speed;
        this.y += this.dirY * this.speed;

        // Если дошёл до игрока — урон!
        const dx = this.x - player.x;
        const dy = this.y - player.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < this.radius + 10) {
          health -= 1;
          healthEl.textContent = `Здоровье: ${health}`;
          this.reset(); // Враг "атаковал" и исчезает
        }

        // Если вышел за экран — пересоздать (на случай ошибки)
        if (this.x < -50 || this.x > canvas.width + 50 ||
            this.y < -50 || this.y > canvas.height + 50) {
          this.reset();
        }
      }

      draw() {
        // Тело (круг)
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Голова
        ctx.beginPath();
        ctx.arc(this.x, this.y - this.radius * 0.8, this.radius * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = '#ffd9b3';
        ctx.fill();
        ctx.stroke();
      }

      isHit(bullet) {
        const dx = this.x - bullet.x;
        const dy = this.y - bullet.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        return distance < this.radius + bullet.radius;
      }
    }

    // Создание врагов
    for (let i = 0; i < 6; i++) {
      enemies.push(new Enemy());
    }

    // Рисуем игрока как человека с оружием
    function drawPlayer() {
      const angle = Math.atan2(mouseY - player.y, mouseX - player.x);

      // Тело игрока
      ctx.beginPath();
      ctx.arc(player.x, player.y, 14, 0, Math.PI * 2);
      ctx.fillStyle = '#4da6ff';
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Голова
      ctx.beginPath();
      ctx.arc(player.x, player.y - 11, 9, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd9b3';
      ctx.fill();
      ctx.stroke();

      // Оружие (прямоугольник, повёрнутый к курсору)
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(angle);
      ctx.fillStyle = '#333';
      ctx.fillRect(10, -2, 25, 4); // ствол
      ctx.fillRect(5, -4, 8, 8);  // рукоять
      ctx.restore();
    }

    // Основной игровой цикл
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Стрельба
      if (isShooting) {
        const angle = Math.atan2(mouseY - player.y, mouseX - player.x);
        bullets.push(new Bullet(player.x + Math.cos(angle) * 20, player.y + Math.sin(angle) * 20, angle));
      }

      // Пули
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].update();
        bullets[i].draw();

        if (bullets[i].isOffScreen()) {
          bullets.splice(i, 1);
        }
      }

      // Враги
      for (let i = enemies.length - 1; i >= 0; i--) {
        enemies[i].update();
        enemies[i].draw();

        // Проверка попаданий
        for (let j = bullets.length - 1; j >= 0; j--) {
          if (enemies[i].isHit(bullets[j])) {
            score += 10;
            scoreEl.textContent = `Очки: ${score}`;
            bullets.splice(j, 1);
            enemies[i].reset();
            break;
          }
        }
      }

      // Рисуем игрока
      drawPlayer();

      // Прицел (тонкий крестик)
      ctx.strokeStyle = '#00ff00';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(mouseX - 8, mouseY);
      ctx.lineTo(mouseX + 8, mouseY);
      ctx.moveTo(mouseX, mouseY - 8);
      ctx.lineTo(mouseX, mouseY + 8);
      ctx.stroke();

      // Проверка окончания игры
      if (health <= 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff5555';
        ctx.font = '40px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('ИГРА ОКОНЧЕНА', canvas.width / 2, canvas.height / 2);
        ctx.font = '20px Arial';
        ctx.fillText(`Ваш счёт: ${score}`, canvas.width / 2, canvas.height / 2 + 40);
        return;
      }

      requestAnimationFrame(gameLoop);
    }

    // Запуск игры
    gameLoop();

    // Добавляем новых врагов со временем (простая волна)
    setInterval(() => {
      if (health > 0) {
        enemies.push(new Enemy());
      }
    }, 5000);
  </script>
</body>
</html>
